name: Release Extension Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Attach Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#v}
          ZIP_NAME="yandex-music-downloader-v${VERSION}.zip"
          # Полный список рантайм-файлов расширения — синхронизировать с manifest.json.
          # inject.js (MAIN world) и offscreen.* обязательны с v1.2.0: без них
          # распакованное расширение не запускается.
          FILES="manifest.json background.js content.js content.css inject.js id3-writer.js md5.js popup.html popup.css popup.js offscreen.html offscreen.js icons LICENSE README.md"
          zip -r "dist/${ZIP_NAME}" $FILES
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "✓ Created package dist/${ZIP_NAME}"

      - name: Verify package contents
        run: |
          for f in manifest.json background.js content.js inject.js offscreen.html offscreen.js popup.html; do
            unzip -l "dist/${ZIP_NAME}" | grep -q " ${f}$" || { echo "::error::${f} missing from release package"; exit 1; }
          done
          echo "✓ Package contains all runtime files"

      - name: Upload Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          generate_release_notes: true
