name: CI & Extension Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Extension & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Workflow YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/ci.yml'))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Manifest V3 Structure
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (!manifest.name) throw new Error('Missing name in manifest.json');
            if (!manifest.version) throw new Error('Missing version in manifest.json');
            if (!manifest.background || !manifest.background.service_worker) throw new Error('Missing background service_worker');
            
            const files = [
              manifest.background.service_worker,
              'offscreen.html',
              ...manifest.content_scripts.flatMap(cs => [...(cs.js || []), ...(cs.css || [])]),
              ...Object.values(manifest.icons)
            ];
            for (const file of files) {
              if (!fs.existsSync(file)) throw new Error('Referenced file does not exist: ' + file);
            }
            console.log('✓ Manifest V3 schema and referenced assets validated successfully');
          "

      - name: Validate JavaScript Syntax
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            case "$file" in
              scripts/e2e_page_expr.js|scripts/e2e_v123.js|scripts/play_and_capture_expr.js)
                # These files are CDP Runtime.evaluate snippets: they use top-level
                # await/return, so they are syntax-checked inside an async wrapper.
                tmp="$(mktemp --suffix=.js)"
                {
                  echo 'async function __ymSyntaxCheck() {'
                  cat "$file"
                  echo '}'
                } > "$tmp"
                node --check "$tmp"
                rm -f "$tmp"
                ;;
              *)
                node --check "$file"
                ;;
            esac
          done < <(git ls-files -z -- '*.js')
          echo "✓ Syntax check passed for $checked tracked JavaScript files"

      - name: Package Extension ZIP
        run: |
          mkdir -p dist
          # Полный список рантайм-файлов расширения — синхронизировать с manifest.json.
          FILES="manifest.json background.js content.js content.css inject.js id3-writer.js md5.js popup.html popup.css popup.js offscreen.html offscreen.js icons LICENSE README.md"
          zip -r dist/yandex-music-downloader.zip $FILES
          echo "✓ Built extension package: dist/yandex-music-downloader.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-music-downloader-build
          path: dist/yandex-music-downloader.zip
          retention-days: 14

  surfaces:
    name: Test Extension Surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run Surface Tests
        shell: bash
        env:
          YM_CI_STRICT: '1'
          YM_CDP_PORT: '9223'
          YM_WAIT_MS: '20000'
        run: |
          set -euo pipefail

          CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -z "$CHROME" ] || [ ! -x "$CHROME" ]; then
            echo "Chrome executable was not provided by setup-chrome" >&2
            exit 1
          fi

          node -e "if (typeof fetch !== 'function' || typeof WebSocket !== 'function') { console.error('Node.js must provide global fetch and WebSocket'); process.exit(1); }"

          EXTENSION_DIR="$(mktemp -d -t ym-extension-XXXXXX)"
          PROFILE_DIR="$(mktemp -d -t ym-chrome-profile-XXXXXX)"
          LOG_FILE="$(mktemp -t ym-surfaces-XXXXXX.log)"
          CHROME_LOG="$(mktemp -t ym-chrome-XXXXXX.log)"

          cp manifest.json background.js content.js content.css inject.js \
            id3-writer.js md5.js popup.html popup.css popup.js \
            offscreen.html offscreen.js "$EXTENSION_DIR/"
          cp -R icons "$EXTENSION_DIR/"

          CHROME_PID=""
          cleanup() {
            set +e
            if [ -n "$CHROME_PID" ]; then
              kill -- "-$CHROME_PID" 2>/dev/null
              wait "$CHROME_PID" 2>/dev/null
            fi
          }
          trap cleanup EXIT

          setsid "$CHROME" \
            --headless=new \
            --no-sandbox \
            --autoplay-policy=no-user-gesture-required \
            --remote-debugging-port="$YM_CDP_PORT" \
            --user-data-dir="$PROFILE_DIR" \
            --disable-extensions-except="$EXTENSION_DIR" \
            --load-extension="$EXTENSION_DIR" \
            "https://music.yandex.ru/" \
            >"$CHROME_LOG" 2>&1 &
          CHROME_PID=$!

          if ! timeout 120 bash -c '
            until curl --fail --silent --show-error --max-time 2 \
              "http://127.0.0.1:${YM_CDP_PORT}/json/list" >/dev/null 2>&1; do
              sleep 1
            done
          '; then
            echo "Chrome DevTools endpoint did not become ready within 120 seconds" >&2
            cat "$CHROME_LOG" >&2
            exit 1
          fi

          set +e
          timeout 420 node scripts/test_surfaces.js 2>&1 | tee "$LOG_FILE"
          test_status=${PIPESTATUS[0]}
          set -e

          summary=""
          if summary_line="$(awk '/^Итого: PASS [0-9]+, FAIL [0-9]+, SKIP [0-9]+$/ { line=$0 } END { print line }' "$LOG_FILE")"; then
            summary="$summary_line"
          fi

          if [ "$test_status" -ne 0 ]; then
            echo "Surface test command exited with code $test_status" >&2
            cat "$CHROME_LOG" >&2
            exit "$test_status"
          fi

          if [ -z "$summary" ]; then
            echo "Surface test summary was not found in the output" >&2
            cat "$LOG_FILE" >&2
            cat "$CHROME_LOG" >&2
            exit 1
          fi

          echo "$summary"
          if [[ "$summary" =~ PASS\ ([0-9]+),\ FAIL\ ([0-9]+),\ SKIP\ ([0-9]+) ]]; then
            failed_count="${BASH_REMATCH[2]}"
            skipped_count="${BASH_REMATCH[3]}"
          else
            echo "Could not parse surface test summary: $summary" >&2
            exit 1
          fi

          if [ "$failed_count" -ne 0 ]; then
            echo "Surface test failed: FAIL count is $failed_count" >&2
            exit 1
          fi

          if [ "$skipped_count" -ne 0 ]; then
            echo "Surface test failed in strict CI mode: SKIP count is $skipped_count" >&2
            exit 1
          fi
