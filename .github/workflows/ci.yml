name: CI & Extension Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Extension & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Manifest V3 Structure
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (!manifest.name) throw new Error('Missing name in manifest.json');
            if (!manifest.version) throw new Error('Missing version in manifest.json');
            if (!manifest.background || !manifest.background.service_worker) throw new Error('Missing background service_worker');
            
            const files = [
              manifest.background.service_worker,
              ...manifest.content_scripts.flatMap(cs => cs.js),
              ...Object.values(manifest.icons)
            ];
            for (const file of files) {
              if (!fs.existsSync(file)) throw new Error('Referenced file does not exist: ' + file);
            }
            console.log('✓ Manifest V3 schema and referenced assets validated successfully');
          "

      - name: Validate JavaScript Syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check id3-writer.js
          node --check md5.js
          echo "✓ All JavaScript files passed syntax check"

      - name: Package Extension ZIP
        run: |
          mkdir -p dist
          zip -r dist/yandex-music-downloader.zip manifest.json background.js content.js content.css popup.html popup.css popup.js id3-writer.js md5.js icons LICENSE README.md
          echo "✓ Built extension package: dist/yandex-music-downloader.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-music-downloader-build
          path: dist/yandex-music-downloader.zip
          retention-days: 14
