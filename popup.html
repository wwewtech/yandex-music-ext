<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12100d">
  <title>Yandex Music Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="deck">

    <!-- Шапка: модель прибора + лампа питания -->
    <header class="deck-head">
      <div class="deck-id">
        <span class="deck-model">YM&#8209;DL</span>
        <span class="deck-rev">MK.III</span>
      </div>
      <div class="power" id="powerLamp" role="status">
        <span class="power-lamp" aria-hidden="true"></span>
        <span class="power-label" id="statusLabel">Готов</span>
      </div>
    </header>

    <!-- Лента трека -->
    <section class="tape" aria-live="polite">
      <div class="tape-cover-frame">
        <img src="icons/icon128.png" alt="" id="trackCover" class="tape-cover" width="72" height="72">
        <span class="tape-screws" aria-hidden="true"></span>
      </div>
      <div class="tape-meta">
        <div class="tape-title" id="trackTitle">—</div>
        <div class="tape-artist" id="trackArtist">воспроизведение не запущено</div>
        <div class="tape-album" id="trackAlbum"></div>
      </div>
    </section>

    <!-- VU-шкала состояния -->
    <div class="vu" aria-hidden="true">
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
      <span class="vu-seg"></span><span class="vu-seg vu-hot"></span><span class="vu-seg vu-hot"></span>
    </div>

    <!-- Клавиша загрузки -->
    <button class="key" id="downloadCurrentBtn">
      <svg class="key-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      <span id="downloadBtnText">Скачать трек</span>
    </button>

    <!-- Пакетная запись -->
    <button class="row-action" id="batchDownloadBtn">
      <span class="row-action-label">Записать всё</span>
      <span class="row-action-hint">плейлист или альбом целиком</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M9 18l6-6-6-6v12z"/>
      </svg>
    </button>

    <!-- Панель настроек -->
    <section class="panel" aria-label="Настройки">
      <div class="panel-head">
        <span>Панель</span>
        <span class="panel-rule" aria-hidden="true"></span>
      </div>

      <label class="sw-row">
        <span class="sw-text">
          <span class="sw-name">Теги и обложка</span>
          <span class="sw-hint">вшить метаданные и арт в файл</span>
        </span>
        <input type="checkbox" role="switch" id="settingEmbedTags" checked>
        <span class="sw" aria-hidden="true"><i></i></span>
      </label>

      <label class="sw-row">
        <span class="sw-text">
          <span class="sw-name">Индикация на странице</span>
          <span class="sw-hint">шкала прогресса поверх плеера</span>
        </span>
        <input type="checkbox" role="switch" id="settingToasts" checked>
        <span class="sw" aria-hidden="true"><i></i></span>
      </label>

      <div class="sel-row">
        <span class="sw-text">
          <span class="sw-name">Имя файла</span>
          <span class="sw-hint" id="nameHint">шаблон сохранения</span>
        </span>
      </div>
      <div class="sel-wrap">
        <select id="settingFilenamePattern" aria-label="Формат имени файла">
          <option value="artist-title">Артист — Название</option>
          <option value="title-artist">Название — Артист</option>
          <option value="title-only">Название</option>
          <option value="custom">Свой шаблон…</option>
        </select>
        <input type="text" id="settingFilenameCustom" class="tpl-input" spellcheck="false"
               placeholder="{artist} — {title}" aria-label="Свой шаблон имени файла" hidden>
        <span class="tpl-tokens" id="tplTokens" hidden>{artist} {title} {album} {year}</span>
      </div>

      <label class="sw-row">
        <span class="sw-text">
          <span class="sw-name">Спрашивать папку</span>
          <span class="sw-hint">диалог браузера перед каждым файлом</span>
        </span>
        <input type="checkbox" role="switch" id="settingSaveAs">
        <span class="sw" aria-hidden="true"><i></i></span>
      </label>
    </section>

    <!-- Подвал -->
    <footer class="deck-foot">
      <span class="foot-ver">v1.4.0</span>
      <a href="https://github.com/wwewtech/yandex-music-ext" target="_blank" rel="noopener" class="foot-link">репозиторий</a>
      <a href="https://github.com/wwewtech/yandex-music-ext/issues" target="_blank" rel="noopener" class="foot-link">сообщить о баге</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
